name: .NET quality checks

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore SecureApiQualityPlatform.Web/SecureApiQualityPlatform.Web.csproj
      - name: Build
        run: dotnet build SecureApiQualityPlatform.Web/SecureApiQualityPlatform.Web.csproj --configuration Release --no-restore
      - name: Test
        run: dotnet test SecureApiQualityPlatform.Tests/SecureApiQualityPlatform.Tests.csproj --configuration Release --collect "XPlat Code Coverage"
